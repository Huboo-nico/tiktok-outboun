<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoLead PRO</title>
    <script>
      // Safety patch for "Cannot set property fetch which has only a getter" error
      // Some libraries try to polyfill fetch and fail if it's a read-only getter in certain environments
      if (typeof window !== 'undefined') {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { console.warn('Supressed attempt to redefine fetch:', v); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch protection failed:', e);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
